name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          ndk-version: '25.2.9519653'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev ninja-build clang cmake pkg-config mesa-utils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Flutter & Permissions
        run: |
          flutter config --android-sdk "$ANDROID_HOME"
          yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Temporarily Hide requirements.txt for Flet
        run: |
          if [ -f requirements.txt ]; then mv requirements.txt requirements.txt.bak; fi

      - name: Build APK com Flet
        run: |
          flet build apk --python-version 3.12 --yes -v
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Restore requirements.txt
        if: always()
        run: |
          if [ -f requirements.txt.bak ]; then mv requirements.txt.bak requirements.txt; fi

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
