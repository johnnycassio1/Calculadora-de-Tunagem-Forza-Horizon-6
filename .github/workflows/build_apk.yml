name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev ninja-build clang cmake pkg-config mesa-utils

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet serious_python
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate Flet App Shell
        run: |
          flet build apk --python-version 3.12 --yes || true

      - name: Bundle Python Code (Serious Python)
        run: |
          cd build/flutter
          flutter pub get
          
          # Garante a criação do diretório de assets
          mkdir -p assets/app

          # Empacota o código-fonte da raiz no zip que o Serious Python consome
          dart run serious_python:main package ../.. --platform Android --python-version 3.12 --exclude build

      - name: Build APK Direct via Flutter
        run: |
          cd build/flutter
          flutter build apk --release --target-platform android-arm64

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
