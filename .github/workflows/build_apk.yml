name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev ninja-build clang cmake pkg-config mesa-utils

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Flutter & Android
        run: |
          flutter config --android-sdk "$ANDROID_HOME"
          yes | flutter doctor --android-licenses || true

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate Flet App Shell
        run: |
          flet build apk --python-version 3.12 --yes || true

      - name: Package Serious Python Assets & Link Directories
        run: |
          cd build/flutter
          flutter pub get
          dart run serious_python:main package ../.. --platform Android --python-version 3.12 --exclude build
          
          # Garante que as pastas de site-packages e assets existam
          mkdir -p build/site-packages/arm64-v8a
          mkdir -p assets/app

      - name: Build APK Direct via Flutter
        run: |
          cd build/flutter
          export SERIOUS_PYTHON_SITE_PACKAGES="$(pwd)/build/site-packages/arm64-v8a"
          flutter build apk --release --target-platform android-arm64

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
